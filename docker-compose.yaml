name: ntfy

services:
  ntfy:
    image: ${NTFY_IMAGE:-binwiederhier/ntfy}:${NTFY_VERSION:?NTFY_VERSION is not set, run bash ./install.sh}
    container_name: ntfy
    restart: unless-stopped
    command: serve
    init: true
    environment:
      NTFY_BASE_URL: https://${NTFY_DOMAIN:?NTFY_DOMAIN is not set, run bash ./install.sh}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: ${NTFY_CACHE_DURATION:-24h}
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-deny-all}
      NTFY_ENABLE_LOGIN: "true"
      NTFY_LOG_LEVEL: ${NTFY_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 -O - http://localhost:80/v1/health | grep -q '\"healthy\":true'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ntfy.rule=Host(`${NTFY_DOMAIN}`)"
      - "traefik.http.services.ntfy.loadbalancer.server.port=80"
